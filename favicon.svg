<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 22 492 492">
  <!-- "sombra": a mesma estrela em preto, deslocada para a esquerda e para baixo,
       que aparece como o traço mais grosso desses lados -->
  <path d="M213 50 L295 172 L440 170 L350 282 L390 415 L255 372 L120 455 L150 302 L10 232 L160 190 Z"
        transform="translate(-13 12)" fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
  <!-- estrela principal: miolo branco e contorno preto fino
       (o miolo branco faz o ícone aparecer também em abas escuras) -->
  <path d="M213 50 L295 172 L440 170 L350 282 L390 415 L255 372 L120 455 L150 302 L10 232 L160 190 Z"
        fill="#fff" stroke="#000" stroke-width="11" stroke-linejoin="round"/>
</svg>
